<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0c1111" />
    <meta
      name="description"
      content="Explore the evidence behind ecological restoration in Canada."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Understory - Restoration evidence</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app">
      <div class="ambient-background" aria-hidden="true"><canvas id="terrain"></canvas></div>
      <aside class="history-panel" id="history-panel" hidden></aside>
      <header class="site-header" id="site-header">
        <button
          type="button"
          class="site-wordmark"
          data-action="new-question"
          aria-label="Understory home"
        >
          UNDER<span>STORY</span>
        </button>
        <button class="about-button" type="button" data-action="about">
          About the evidence <span data-icon="ArrowUpRight" data-size="15"></span>
        </button>
      </header>
      <main id="main-content">
        <div class="launch-content">
          <h1>What does the <span>evidence say?</span></h1>
          <form class="question-form" id="question-form">
            <label class="sr-only" for="question">Your restoration question</label>
            <textarea
              id="question"
              placeholder="Upload literature and ask about ecological restoration…"
              maxlength="2000"
              spellcheck="true"
            ></textarea>
            <div class="composer-toolbar">
              <label class="upload-button">
                <input type="file" class="sr-only" multiple data-discard-upload />
                <span class="sr-only">Attach files</span>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  fill="currentColor"
                  viewBox="0 0 256 256"
                  aria-hidden="true"
                >
                  <path
                    d="M209.66,122.34a8,8,0,0,1,0,11.32l-82.05,82a56,56,0,0,1-79.2-79.21L147.67,35.94a40,40,0,1,1,56.56,56.56L105,191a24,24,0,1,1-33.94-33.94l83.05-83.06a8,8,0,0,1,11.32,11.32L82.32,168.4a8,8,0,1,0,11.31,11.32L192.64,80.6a24,24,0,0,0-33.92-33.94L59.5,146.66a40,40,0,1,0,56.56,56.56l82.05-82A8,8,0,0,1,209.66,122.34Z"
                  ></path>
                </svg>
              </label>
              <button class="submit-button" type="submit" disabled aria-label="Submit question">
                <span data-icon="ArrowUp" data-size="23"></span>
              </button>
            </div>
          </form>
        </div>
      </main>
      <footer class="site-footer">
        <span>Evidence Jam <span class="footer-year">2026</span> · By Random Team</span>
      </footer>
    </div>
    <dialog id="info-dialog" class="info-dialog" aria-labelledby="dialog-title">
      <div class="dialog-content" id="dialog-content">
        <h2 id="dialog-title" tabindex="-1">About the evidence</h2>
      </div>
    </dialog>
    <dialog id="certainty-dialog" class="certainty-dialog" aria-labelledby="certainty-heading">
      <div class="certainty-dialog-content">
        <button
          class="certainty-dialog-close"
          type="button"
          aria-label="Close certainty explanation"
          data-action="close-certainty"
        >
          <span data-icon="X" data-size="20"></span>
        </button>
        <h2 id="certainty-heading" tabindex="-1">Effect and certainty</h2>
        <div id="certainty-explanation"></div>
      </div>
    </dialog>
    <!-- STATIC_ANSWERS -->
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
